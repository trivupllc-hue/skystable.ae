name: Check and publish Sky Stable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skystable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    name: Validate website and publish authorized main updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code and interactions
        run: |
          npm run lint
          npm test
          npm run check:launch

      - name: Build and verify every page
        run: |
          npm run build
          npm run verify:build

      - name: Check deployment authorization
        id: authorization
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing is not active: add the CLOUDFLARE_API_TOKEN repository secret. Website checks still run."
            echo "Website checks passed. **Publishing was skipped:** the CLOUDFLARE_API_TOKEN repository secret is missing. Follow the one-time setup in README.md, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to Cloudflare
        id: publish
        if: steps.authorization.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ad41879524803fc71144f7e0164c1ee5
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.160.1 deploy

      - name: Verify published homepage and booking page
        if: steps.publish.outcome == 'success'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://skystable.ae/ --output "$RUNNER_TEMP/skystable-home.html"
          cmp dist/index.html "$RUNNER_TEMP/skystable-home.html"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://skystable.ae/book --output "$RUNNER_TEMP/skystable-book.html"
          cmp dist/book/index.html "$RUNNER_TEMP/skystable-book.html"
          echo "Published and verified https://skystable.ae from commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
